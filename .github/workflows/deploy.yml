name: Build and deploy

# Builds mockups/out and publishes it to GitHub Pages.
#
# It will happily overwrite whatever Pages currently serves for whichever repo it lives
# in, so point it at a test repository first (see DEPLOY.md). `master` is here because the
# repo that owns www.steinmetzlab.net predates the main-branch default and still uses it.

on:
  push:
    branches: [main, master]
    paths:
      - 'mockups/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:        # lets you deploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and don't cancel one that is mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # build.py needs nothing else: the data it reads lives in the repo, and the heavy
      # recording-derived assets are pre-generated by the tools/ scripts on a lab machine.
      - name: Build
        working-directory: mockups
        run: python build.py --force

      # A hostname can be claimed by exactly one repository, so only the repo that owns
      # www.steinmetzlab.net ships a CNAME. Deployments of this same workflow from a test
      # repo publish without one and stay on their github.io URL.
      - name: Claim the custom domain
        if: github.repository == 'SteinmetzLab/SteinmetzLab.github.io'
        run: echo 'www.steinmetzlab.net' > mockups/out/CNAME

      - name: Check nothing was left unrendered
        working-directory: mockups
        run: |
          if grep -rl '{{' out/*.html; then
            echo "::error::unresolved template tokens in the built HTML"
            exit 1
          fi

      # A single uncaught exception in the page script leaves every reveal-on-scroll
      # section invisible, which looks like "the page stops below the hero". Run each
      # page's script against a DOM stub so that failure can never ship again. runpage.js
      # follows <script src> as well, so a page whose linked engine or recording went
      # missing fails here rather than in somebody's browser.
      - name: Smoke-test the page scripts
        working-directory: mockups
        run: |
          for f in out/*.html; do
            node tools/runpage.js "$f" || exit 1
          done

      # The pages link their fonts, clips and recordings instead of inlining them, which
      # is the difference between a 75 KB homepage and a 2.6 MB one. It is an easy thing
      # to undo by accident, and nothing else would notice, so assert it.
      - name: Check the pages stayed small
        working-directory: mockups
        run: |
          big=$(ls -S out/a2-*.html out/ns-*.html out/index.html | head -1)
          kb=$(( $(wc -c < "$big") / 1024 ))
          echo "largest deployed page: $big (${kb} KB)"
          if [ "$kb" -gt 250 ]; then
            echo "::error::$big is ${kb} KB -- an asset is being inlined again"
            exit 1
          fi

      # enablement lets the first run turn Pages on itself, instead of failing until
      # somebody sets Settings -> Pages -> Source by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mockups/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
