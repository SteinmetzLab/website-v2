name: Build and deploy

# Builds mockups/out and publishes it to GitHub Pages.
#
# Deliberately runs on a branch called `main` only. Point this at a TEST repository first
# (see DEPLOY.md); it will happily overwrite whatever Pages currently serves for whichever
# repo it lives in.

on:
  push:
    branches: [main]
    paths:
      - 'mockups/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:        # lets you deploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and don't cancel one that is mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # build.py needs nothing else: the data it reads lives in the repo, and the heavy
      # recording-derived assets are pre-generated by the tools/ scripts on a lab machine.
      - name: Build
        working-directory: mockups
        run: python build.py --force

      - name: Check nothing was left unrendered
        working-directory: mockups
        run: |
          if grep -rl '{{' out/*.html; then
            echo "::error::unresolved template tokens in the built HTML"
            exit 1
          fi

      # A single uncaught exception in the page script leaves every reveal-on-scroll
      # section invisible, which looks like "the page stops below the hero". Run each
      # page's script against a DOM stub so that failure can never ship again.
      - name: Smoke-test the page scripts
        working-directory: mockups
        run: |
          for f in out/index.html out/a2-signal.html out/a-signal.html \
                   out/a-publications.html out/a-news.html; do
            node tools/runpage.js "$f" || exit 1
          done

      # enablement lets the first run turn Pages on itself, instead of failing until
      # somebody sets Settings -> Pages -> Source by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mockups/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
